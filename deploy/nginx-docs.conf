server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/snippets/security-headers-docs.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Quartz emits no fingerprinted filenames: every build overwrites the same
    # /postscript.js and /static/contentIndex.json. Anything cached by their URL
    # therefore outlives the deploy that replaced it, and the browser ends up
    # running one build's bundle against another build's pages — which is not a
    # visible error, just features that quietly do nothing. Only the fonts below
    # are stable enough to keep. Without an explicit header here the CDN applies
    # a default TTL of its own, which is how this went unnoticed.
    location /static/fonts/ {
        include /etc/nginx/snippets/security-headers-docs.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location /static/ {
        include /etc/nginx/snippets/security-headers-docs.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers-docs.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html /404.html;
    }
}
