server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/snippets/security-headers-docs.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Quartz emits no fingerprinted filenames: every build overwrites the same
    # /postscript.js and /static/contentIndex.json. Anything cached by their URL
    # therefore outlives the deploy that replaced it, and the browser ends up
    # running one build's bundle against another build's pages — which is not a
    # visible error, just features that quietly do nothing. Only the fonts below
    # are stable enough to keep.
    #
    # `no-store`, not `no-cache`: the two are easy to mix up and the difference is
    # this whole bug. `no-cache` permits a cache to *store* the response as long as
    # it revalidates, and the CDN duly stored it — twice, once per build — then
    # served whichever variant a given client's request keyed to. curl got the
    # current bundle and a browser got the previous one, from the same URL, for
    # hours. `no-store` is the one that says do not keep a copy at all, and
    # CDN-Cache-Control says it to the edge in the header it reads first.
    location /static/fonts/ {
        include /etc/nginx/snippets/security-headers-docs.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location /static/ {
        include /etc/nginx/snippets/security-headers-docs.conf;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers-docs.conf;
        add_header Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        try_files $uri $uri/index.html $uri.html /404.html;
    }
}
