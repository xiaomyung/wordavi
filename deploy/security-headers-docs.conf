add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=()" always;
# 'unsafe-eval' is what the graph costs. Quartz draws it with PixiJS 8, which
# compiles its batch shaders through `new Function`; without this the whole
# postscript bundle throws on load and takes the explorer and search down with
# the graph, so the site renders as plain pages with dead navigation. The v7-era
# @pixi/unsafe-eval shim was never published for 8.x, so there is no way to keep
# the graph and refuse eval. This header applies to the documentation site only —
# the app at wordavi.com keeps its own, stricter policy in security-headers.conf.
# The exposure it adds is bounded by there being no user input here: every page
# is markdown from this repository, served static, with no accounts and no data.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
