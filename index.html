<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- iOS ignores manifest short_name; this sets the home-screen label -->
    <meta name="apple-mobile-web-app-title" content="WordAvi" />
    <!-- viewport-fit=cover: without it iOS reports every env(safe-area-inset-*) as
         0 and the .safe-top/.safe-bottom padding every screen carries does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Учим испанские числа: цены, веса, количество." />
    <meta name="color-scheme" content="light dark" />
    <!-- theme-color mirrors --color-surface in tokens.css (light default / .dark); theme.ts repaints the non-media tag -->
    <meta name="theme-color" content="#FAF2E1" />
    <meta name="theme-color" content="#281C0E" media="(prefers-color-scheme: dark)" />
    <title>WordAvi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
